name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AI (non-camera) firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Check secrets (AI)
        run: |
          BIN=build/ottoclaw.bin
          ! strings "$BIN" | grep -qE 'sk-[a-f0-9]{20,}' || (echo "API key leaked"; exit 1)
          ! strings "$BIN" | grep -qE 'ding[a-z0-9]{10,}' || (echo "DingTalk key leaked"; exit 1)

      - name: Merge AI firmware
        run: |
          . $IDF_PATH/export.sh
          VERSION=${GITHUB_REF_NAME}
          esptool.py --chip esp32s3 merge_bin \
            --flash_mode dio \
            --flash_size 16MB \
            --flash_freq 80m \
            -o ottoclaw-full-${VERSION}-ai.bin \
            0x0      build/bootloader/bootloader.bin \
            0x8000   build/partition_table/partition-table.bin \
            0xf000   build/ota_data_initial.bin \
            0x20000  build/ottoclaw.bin \
            0x420000 build/spiffs.bin

      - name: Build CAM519 firmware
        run: |
          . $IDF_PATH/export.sh
          sed -i 's/CONFIG_OTTOCLAW_BOARD_OTTO_AI=y/# CONFIG_OTTOCLAW_BOARD_OTTO_AI is not set/' sdkconfig
          sed -i 's/# CONFIG_OTTOCLAW_BOARD_CAM519 is not set/CONFIG_OTTOCLAW_BOARD_CAM519=y/' sdkconfig
          sed -i 's/CONFIG_OTTOCLAW_BOARD_VARIANT=1/CONFIG_OTTOCLAW_BOARD_VARIANT=2/' sdkconfig
          rm -rf build
          idf.py set-target esp32s3
          idf.py build

      - name: Check secrets (CAM519)
        run: |
          BIN=build/ottoclaw.bin
          ! strings "$BIN" | grep -qE 'sk-[a-f0-9]{20,}' || (echo "API key leaked"; exit 1)
          ! strings "$BIN" | grep -qE 'ding[a-z0-9]{10,}' || (echo "DingTalk key leaked"; exit 1)

      - name: Merge CAM519 firmware
        run: |
          . $IDF_PATH/export.sh
          VERSION=${GITHUB_REF_NAME}
          esptool.py --chip esp32s3 merge_bin \
            --flash_mode dio \
            --flash_size 16MB \
            --flash_freq 80m \
            -o ottoclaw-full-${VERSION}-cam519.bin \
            0x0      build/bootloader/bootloader.bin \
            0x8000   build/partition_table/partition-table.bin \
            0xf000   build/ota_data_initial.bin \
            0x20000  build/ottoclaw.bin \
            0x420000 build/spiffs.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ottoclaw-full-${{ github.ref_name }}-ai.bin
            ottoclaw-full-${{ github.ref_name }}-cam519.bin
          body: |
            # OttoClaw ${{ github.ref_name }}

            ## Board selection
            - **OttoRobot AI** (no camera) → `ottoclaw-full-${{ github.ref_name }}-ai.bin`
            - **OttoCam519** (camera) → `ottoclaw-full-${{ github.ref_name }}-cam519.bin`

            ## Flashing
            ### Online
            1. Open https://www.16302.com/localinit
            2. Chip: ESP series → Any type
            3. Upload firmware (address 0x0) → Start

            ### esptool
            ```bash
            esptool.py --chip esp32s3 --port PORT --baud 460800 \
              write_flash -z 0x0 ottoclaw-full-${{ github.ref_name }}-ai.bin
            ```
            PORT: `/dev/cu.usbmodem1101` (Mac) / `COM3` (Windows)
